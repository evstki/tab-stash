<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Saved tabs · Tab Stash</title>
    <link rel="stylesheet" href="storage.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="wordmark" href="storage.html">
          <img src="icons/icon-48.png" alt="" />
          <span>Tab Stash</span>
        </a>
      </div>
    </header>

    <main id="main-content" class="page-shell" tabindex="-1">
      <header class="page-header">
        <div>
          <h1>Saved tabs</h1>
          <p id="total-summary">0 tabs</p>
        </div>
        <div class="page-header__actions">
          <button id="open-visible" class="button button--primary" type="button">
            Open all tabs
          </button>
          <button id="delete-visible" class="button button--ghost" type="button">
            Delete all tabs
          </button>
        </div>
      </header>

      <section class="library" aria-labelledby="library-title">
        <h2 id="library-title" class="sr-only">Saved tabs library</h2>

        <div class="library-toolbar">
          <div
            class="view-tabs"
            role="tablist"
            aria-label="Storage views"
            data-view="all"
            data-input="programmatic"
          >
            <button
              id="view-all"
              class="view-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="library-content"
              data-view="all"
            >
              All <span id="count-all">0</span>
            </button>
            <button
              id="view-youtube"
              class="view-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="library-content"
              data-view="youtube"
              tabindex="-1"
            >
              YouTube <span id="count-youtube">0</span>
            </button>
            <button
              id="view-sites"
              class="view-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="library-content"
              data-view="sites"
              tabindex="-1"
            >
              Sites <span id="count-sites">0</span>
            </button>
          </div>

          <label class="search">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="6.5" cy="6.5" r="4.5"></circle>
              <path d="m10 10 4 4"></path>
            </svg>
            <span class="sr-only">Search saved tabs</span>
            <input
              id="search"
              type="search"
              autocomplete="off"
              placeholder="Search"
            />
            <kbd>/</kbd>
          </label>
        </div>

        <div
          id="library-content"
          class="library-content"
          role="tabpanel"
          aria-labelledby="view-all"
          tabindex="-1"
          aria-busy="true"
        ></div>
        <div
          id="result-summary"
          class="sr-only"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </section>
    </main>

    <div id="toast" class="toast" aria-hidden="true">
      <span id="toast-message"></span>
      <button
        id="toast-dismiss"
        class="toast__dismiss"
        type="button"
        aria-label="Dismiss notification"
        tabindex="-1"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="m6 6 8 8M14 6l-8 8"></path>
        </svg>
      </button>
    </div>
    <div id="toast-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="toast-alert" class="sr-only" role="alert" aria-live="assertive"></div>

    <dialog
      id="delete-dialog"
      class="delete-dialog"
      aria-labelledby="delete-dialog-title"
      aria-describedby="delete-dialog-description"
    >
      <form method="dialog">
        <h2 id="delete-dialog-title">Delete saved tabs?</h2>
        <p id="delete-dialog-description"></p>
        <div class="delete-dialog__actions">
          <button class="button" type="submit" value="cancel" autofocus>
            Cancel
          </button>
          <button
            id="delete-dialog-confirm"
            class="button button--danger"
            type="submit"
            value="confirm"
          >
            Delete tabs
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="storage.js"></script>
  </body>
</html>
